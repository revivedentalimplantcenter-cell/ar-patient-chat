function load(k) { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return []; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function pkey(p) { return p.phone + "|" + p.date; }
function buildMsg(name) {
  var t = "Hello " + name + ", thank you for choosing AR Plastic Surgery! We hope you had a good experience at the clinic.";
  if (document.getElementById("t-ig").checked) t += " Follow our work on Instagram: " + IG;
  if (document.getElementById("t-rev").checked) t += " If you were happy with your visit, we would appreciate a Google review: " + REVIEW;
  return t;
}
var MON = {"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun",

function fmtDate(d) { var a = d.split("-"); return (+a[2]) + " " + MON[a[1]]; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var pending = load(PKEY), sent = load(SKEY), lastRemoved = null, snackTimer = null;

// Test entries are synthetic: drop any that are no longer in the fresh list.
// Real unsent patients stay on the list even past the 7-day window.
pending = pending.filter(function (x) { return !x.test || curKeys[pkey(x)]; });

});
save(PKEY, pending);
function updateCount() {
  var n = pending.length;
  document.getElementById("remain").textContent =

}
function cardHTML(p) {

}
function render() {
  var list = document.getElementById("list");
  var ps = pending.slice().sort(function (a, b) {
    return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
  });
  list.innerHTML = ps.length
    ? ps.map(cardHTML).join("")
    : '<div class="empty">No patients waiting for a message.</div>';
  updateCount();
  list.querySelectorAll(".wa").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-k");
      var p = pending.filter(function (x) { return pkey(x) === k; })[0];

      pending = pending.filter(function (x) { return pkey(x) !== k; }); save(PKEY, pending);

      var done = function () { render(); };
      if (card) {
        card.style.transition = "opacity .3s, transform .3s";
        card.style.opacity = "0"; card.style.transform = "translateX(40px)";
        setTimeout(done, 320);
      } else done();
      document.getElementById("snack-txt").textContent = "Messaged " + p.name;
      document.getElementById("snack").classList.add("show");
      clearTimeout(snackTimer);
      snackTimer = setTimeout(function () {
        document.getElementById("snack").classList.remove("show");
      }, 8000);
    });
  });
}
document.getElementById("undo").addEventListener("click", function () {
  if (!lastRemoved) return;
  var k = pkey(lastRemoved);
  sent = sent.filter(function (x) { return x !== k; }); save(SKEY, sent);
  pending.push(lastRemoved); save(PKEY, pending);
  lastRemoved = null;
  document.getElementById("snack").classList.remove("show");
  render();
});
